<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Certificate Generator Portal</title>

<style>
html, body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    font-family: Arial;
    overflow:hidden;
}

/* 🔵 BACKGROUND SLIDER (REAL SLIDE) */
.bg-slider{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
}

.bg-track{
    display: flex;
    width: 500%;
    height: 100%;
    animation: slideBG 100s linear infinite;
}

.bg{
    width: 100%;
    height: 100%;
    background-size: 70%;
    background-position: center;
}


/* BACKGROUND IMAGES */
.bg1{ background-image: url("Images/logo1.jpg"); }
.bg2{ background-image: url("Images/logo2.jpg"); }
.bg3{ background-image: url("Images/logo3.jpg"); }
.bg4{ background-image: url("Images/logo4.jpg"); }

/* RIGHT ➝ LEFT SLIDE */
@keyframes slideBG{
    from{
        transform: translateX(0);
    }
    to{
        transform: translateX(-400%);
    }
}

/* 🔐 LOGIN CENTER */
.center{
    position: relative;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index: 2;
}

/* LOGIN BOX */
.box{
    background:rgba(197, 103, 41, 0.9);
    padding:30px;
    width:330px;
    border-radius:8px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

input, button{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    background:green;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}

.forgot{
    text-align:right;
    font-size:13px;
}
</style>
</head>

<body>
    <script>
    const params=new URLSearchParams(window.location.search);
    if(params.get("logout")==="success")
    {
        alert("logout Successfully");

    }
</script>

<!-- 🔄 BACKGROUND SLIDER -->
<div class="bg-slider">
    <div class="bg-track">
        <div class="bg bg1"></div>
        <div class="bg bg2"></div>
        <div class="bg bg3"></div>
        <div class="bg bg4"></div>
        <!-- repeat first for smooth loop -->
        <div class="bg bg1"></div>
    </div>
</div>

<!-- 🔐 LOGIN BOX -->
<div class="center">
<div class="box">

    <h3 style="text-align:center;">Welcome to Certificate Generator Portal</h3>
    <h2 style="text-align:center;">Login</h2>

    <form action="login.php" method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <div class="forgot">
            <a href="forgot_password.html">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>
    </form>

    <p style="text-align:center;">
        New user?
        <a href="register.html" style="color: rgb(12, 55, 121); text-decoration:none; font-weight:bold;">
            Register
        </a>
    </p>

</div>
</div>

</body>
</html>
